services:
  app:
    image: ghcr.io/jthickma/media-dl-server:latest
    container_name: media-dl-server
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      - ./downloads:/downloads
      - ./config:/config
      - ./cookies:/cookies
    environment:
      - DOWNLOAD_DIR=/downloads
      - CONFIG_DIR=/config
      - COOKIES_DIR=/cookies
      - PORT=8080
    restart: unless-stopped
